name: 資金費率與訊號監控機器人

on:
  schedule:
    - cron: '0 * * * *' # 每小時的第 0 分鐘執行一次 (可依需求更改)
  workflow_dispatch: # 允許你隨時在網頁上手動點擊執行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # 🚀 升級到 v4 解決警告

      - name: Setup Python
        uses: actions/setup-python@v5 # 🚀 升級到 v5 解決警告
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas pandas-ta telebot

      - name: Run Scanner Bot
        run: python alert_bot.py
