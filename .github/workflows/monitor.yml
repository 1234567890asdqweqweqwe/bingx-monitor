name: 資金費率監控機器人

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v3
        
      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: 安裝套件
        run: pip install ccxt requests pandas pandas-ta
        
      - name: 執行監控腳本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python alert_bot.py
